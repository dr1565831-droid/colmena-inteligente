<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Colmena Inteligente</title>
    <script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode');</script>
    <style>
        /* Mismos estilos exactos que login.html para mantener consistencia */
        :root { --bg-color: #0f0f0f; --amarillo-miel: #ffb300; --cafe-dorado: #b8860b; --card-bg: rgba(26, 26, 26, 0.9); --text-color: #e0e0e0; }
        :root.light-mode { --bg-color: #f5f5f5; --amarillo-miel: #d68900; --cafe-dorado: #a87b00; --card-bg: rgba(255, 255, 255, 0.95); --text-color: #222222; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="56" height="98" viewBox="0 0 56 98"><path d="M28 0 L56 16.16 L56 48.49 L28 64.65 L0 48.49 L0 16.16 Z M28 98 L56 81.84 L56 49.51 L28 33.35 L0 49.51 L0 81.84 Z" fill="none" stroke="rgba(184, 134, 11, 0.15)" stroke-width="1"/></svg>'); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: var(--text-color); }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 2px solid var(--cafe-dorado); text-align: center; max-width: 380px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .header-container img { width: 60px; }
        h1 { color: var(--amarillo-miel); margin: 0; letter-spacing: 4px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--amarillo-miel); font-weight: bold;}
        .input-group input { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--cafe-dorado); background: transparent; color: var(--text-color); outline: none; }
        .input-group input:focus { border-color: var(--amarillo-miel); }
        .btn-submit { background-color: transparent; border: 2px solid var(--cafe-dorado); color: var(--text-color); padding: 12px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-submit:hover { background-color: var(--amarillo-miel); color: #000; border-color: var(--amarillo-miel); }
        .links { margin-top: 20px; font-size: 0.9rem; }
        .links a { color: var(--amarillo-miel); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-container">
            <img src="logo.png" alt="Logo">
            <h1>ABJ</h1>
        </div>
        <p>Crear Cuenta Nueva</p>
        
        <div class="input-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="usuario@correo.com">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres">
        </div>
        
        <button id="registerBtn" class="btn-submit">Registrarse</button>
        <div class="links">
            <a href="index.html">⬅ Volver al Inicio</a> | <a href="login.html">Iniciar Sesión</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBwKBot_swtev-g7OxwFP9Jk_q2EGsAPnA", authDomain: "colmenainteligente-ee7a8.firebaseapp.com", databaseURL: "https://colmenainteligente-ee7a8-default-rtdb.firebaseio.com", projectId: "colmenainteligente-ee7a8", storageBucket: "colmenainteligente-ee7a8.firebasestorage.app", messagingSenderId: "454952379571", appId: "1:454952379571:web:4555ea465685074614bcc6" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('registerBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            createUserWithEmailAndPassword(auth, email, pass)
                .then(() => { 
                    localStorage.removeItem('demoMode'); 
                    window.location.href = "menu.html"; 
                })
                .catch((error) => { alert("Error al registrar: " + error.message); });
        });
    </script>
</body>
</html>
