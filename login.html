<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - ABJ</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .login-box h2 { color: #4CAF50; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Bienvenido a ABJ</h2>
        <form action="mis_colmenas.html" method="GET">
            <input type="text" placeholder="Usuario o Correo" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p style="font-size: 12px; color: #666; margin-top: 15px;"><a href="index.html">← Volver al inicio</a></p>
    </div>
</body>
</html>
