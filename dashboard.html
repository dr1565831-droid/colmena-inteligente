<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colmena 1 - Dashboard ABJ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f9; margin: 0; }
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .nav-back { text-decoration: none; color: #4CAF50; font-weight: bold; }
        h1 { color: #333; margin: 0; text-align: center; flex-grow: 1; }
        
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="nav-back">← Volver al Inicio</a>
        <h1>Dashboard: Colmena 1</h1>
        <div style="width: 120px;"></div> <!-- Espaciador para centrar el título -->
    </div>

    <table id="tabla-datos">
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>🐝 Abejas</th>
                <th>🌡️ Temp (°C)</th>
                <th>💧 Humedad (%)</th>
                <th>⚖️ Peso</th>
                <th>🔊 Ruido</th>
            </tr>
        </thead>
        <tbody id="tbody-datos">
            <tr><td colspan="6">Conectando con los sensores de la Colmena 1...</td></tr>
        </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de tu base de datos Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBwKBot_swtev-g7OxwFP9Jk_q2EGsAPnA",
            authDomain: "colmenainteligente-ee7a8.firebaseapp.com",
            databaseURL: "https://colmenainteligente-ee7a8-default-rtdb.firebaseio.com",
            projectId: "colmenainteligente-ee7a8",
            storageBucket: "colmenainteligente-ee7a8.firebasestorage.app",
            messagingSenderId: "454952379571",
            appId: "1:454952379571:web:4555ea465685074614bcc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Referencia al historial, limitando a los últimos 20 registros
        const historialRef = query(ref(db, 'historial/'), limitToLast(20));

        onValue(historialRef, (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('tbody-datos');
            tbody.innerHTML = ''; 

            if (data) {
                // Invertir para mostrar los datos más recientes en la parte superior
                const keys = Object.keys(data).reverse();
                
                keys.forEach((key) => {
                    const item = data[key];
                    const fila = document.createElement('tr');
                    
                    const fechaObj = new Date(item.fecha);
                    const fecha = fechaObj.toLocaleString();

                    fila.innerHTML = `
                        <td>${fecha}</td>
                        <td><strong>${item.abejas}</strong></td>
                        <td>${item.temp ? item.temp.toFixed(1) : 'N/A'}</td>
                        <td>${item.hum ? item.hum.toFixed(1) : 'N/A'}</td>
                        <td>${item.peso ? item.peso.toFixed(2) : '0'}</td>
                        <td>${item.ruido ? "Detectado" : "Normal"}</td>
                    `;
                    tbody.appendChild(fila);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="6">No hay datos registrados aún.</td></tr>';
            }
        });
    </script>
</body>
</html>
